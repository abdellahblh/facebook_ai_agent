# English production-readiness eval set for the Facebook/Messenger AI agent
# Generated against abdellahblh/facebook_ai_agent @ algerian_version (ba67e59)
# See README.md in this package for category descriptions, known repo bugs
# this dataset will surface, and the guardrails-testing gap.
#
# Business is a generic placeholder ("Nova Gadgets") -- swap freely, per your
# own instruction to ignore naming/prompt wording.
#
# Schema:
#   id               stable identifier, safe to reference in bug reports
#   category         one of the 11 categories -- see README for what each tests
#   text             the customer message (or " || "-joined turns for multi_turn_context)
#   expect_tool      product_lookup | policy_search | null (null = no tool required)
#   expect_handoff   true if handoff_to_human MUST fire
#   expect_not_found true if the lookup should come back empty and the bot must admit it
#   expect_fact      a literal substring that MUST appear in a correct answer, when
#                    checkable (a price, a day count, a policy keyword) -- null otherwise
#   trap             why this row is hard / what a wrong answer looks like
#   confidence       high | medium | low -- my confidence this phrasing is realistic
