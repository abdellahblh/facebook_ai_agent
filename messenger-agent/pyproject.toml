[project]
name = "messenger-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "bfg>=0.1.0",
]

# ── The gate: same setup that caught 19 bugs in the debugger project ─────────

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "B", "S", "ASYNC", "UP", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]   # asserts + hardcoded TEST tokens are fine in tests

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
